# ==========================================================================
# auto_video.yml
# ==========================================================================
# ملف GitHub Actions لتشغيل نظام إنتاج الفيديو الوثائقي الغامض/الجنائي
# تلقائياً مرة كل أسبوع، ورفع النتيجة إلى Google Drive.
#
# ملاحظة هامة: كل الخدمات المستخدمة هنا مجانية بالكامل (Edge-TTS و
# Pollinations.ai لا يحتاجان أي مفتاح API إطلاقاً). المفاتيح السرية
# الوحيدة المطلوبة في إعدادات المستودع:
#   Settings > Secrets and variables > Actions > New repository secret
#
#   - GEMINI_API_KEY                (مجاني - Free Tier من Google AI Studio)
#   - GOOGLE_DRIVE_FOLDER_ID
#   - GOOGLE_SERVICE_ACCOUNT_JSON    (محتوى ملف JSON كاملاً كسلسلة نصية)
# ==========================================================================

name: Auto Dark Documentary Video Generator

on:
  schedule:
    - cron: "0 8 * * 1"

  workflow_dispatch:
    inputs:
      topic:
        description: "موضوع الحلقة (اختياري - اتركه فارغاً لاختيار موضوع عشوائي)"
        required: false
        default: ""
      scenes:
        description: "عدد المشاهد"
        required: false
        default: "8"

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google Service Account credentials file
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Run video generation pipeline
        env:
          AI_PROVIDER: "gemini"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: "service_account.json"
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python main.py --topic "${{ github.event.inputs.topic }}" --scenes "${{ github.event.inputs.scenes }}"
          else
            python main.py --scenes "${{ github.event.inputs.scenes || 8 }}"
          fi

      - name: Clean up credentials file
        if: always()
        run: rm -f service_account.json
