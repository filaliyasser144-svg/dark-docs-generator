name: Auto Dark Documentary Video Generator

on:
  schedule:
    - cron: "0 8 * * 1"

  workflow_dispatch:
    inputs:
      topic:
        description: "موضوع الحلقة (اختياري - اتركه فارغاً لاختيار موضوع عشوائي)"
        required: false
        default: ""
      scenes:
        description: "عدد المشاهد (20 تقريباً = فيديو 15-20 دقيقة)"
        required: false
        default: "20"

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run video generation pipeline
        env:
          AI_PROVIDER: "gemini"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python main.py --topic "${{ github.event.inputs.topic }}" --scenes "${{ github.event.inputs.scenes }}"
          else
            python main.py --scenes "${{ github.event.inputs.scenes || 20 }}"
          fi
